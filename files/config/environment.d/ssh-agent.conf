# Point ssh at the socket systemd's ssh-agent.socket listens on.
#
# Must be ${XDG_RUNTIME_DIR}, not %t: systemd expands % specifiers only in
# unit files, never in environment.d, so %t stayed a literal string here and
# SSH_AUTH_SOCK pointed at a path that does not exist - silently breaking
# ssh-add and SSH-signed git commits. environment.d does expand ${VAR}, and
# pam_systemd always sets XDG_RUNTIME_DIR.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
